<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crove Free Nodes</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:32px 18px}h1{margin-bottom:6px}.card{background:white;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #0000000d}code{display:block;background:#f1f3f7;padding:12px;border-radius:10px;overflow:auto}.btn{border:0;border-radius:10px;padding:10px 14px;margin:6px 4px 0 0;cursor:pointer}small{color:#687386}</style></head><body><main><h1>🌐 Crove Free Nodes</h1><small>公开节点聚合与订阅服务</small><div class="card"><h2>订阅地址</h2><p>Clash / Mihomo</p><code id="clash">加载中…</code><button class="btn" onclick="copy('clash')">复制</button><p>Shadowrocket / Base64</p><code id="sr">加载中…</code><button class="btn" onclick="copy('sr')">复制</button></div><div class="card"><h2>状态</h2><p id="status">读取中…</p></div><div class="card"><h2>使用说明</h2><p>将对应地址添加到客户端的订阅中，然后在客户端内测速并选择可用节点。</p><small>免费公开节点存在失效、拥堵及安全风险，请勿用于敏感账户。</small></div></main><script>const b=location.origin;document.querySelector('#clash').textContent=b+'/clash.yaml';document.querySelector('#sr').textContent=b+'/shadowrocket.txt';fetch('status.json').then(r=>r.json()).then(x=>document.querySelector('#status').textContent=`节点 ${x.nodes} 个 · 更新时间 ${x.updated_at}`).catch(()=>document.querySelector('#status').textContent='暂时无法读取状态');function copy(id){navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>alert('已复制'))}</script></body></html>
